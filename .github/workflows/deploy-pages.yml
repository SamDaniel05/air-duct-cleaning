name: Deploy Airduct templates to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build all four templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public
          cat > public/favicon.svg <<'FAVICON'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><rect width="48" height="48" rx="24" fill="#203238"/><g fill="none" stroke="#f3f0e8" stroke-width="2.8" stroke-linecap="round"><path d="M9 15h17c5 0 5-7 0-7-2 0-3 1-4 2M5 24h29c6 0 6-8 0-8-2 0-3 1-4 3M10 33h16c5 0 5 7 0 7-2 0-3-1-4-2"/></g><circle cx="38" cy="32" r="2.2" fill="#f3f0e8"/></svg>
          FAVICON
          for template in architectural airflow-lab clear-living field-notes; do
            echo "Building $template"
            npm --prefix "templates/$template" install
            npm --prefix "templates/$template" run build
            mkdir -p "public/$template"
            cp -R "templates/$template/dist/." "public/$template/"
          done
          cat > public/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" type="image/svg+xml" href="./favicon.svg"><title>Airduct Templates</title><style>body{font-family:Inter,Arial,sans-serif;background:#f3f0e8;color:#203238;max-width:760px;margin:10vh auto;padding:24px}h1{font-size:clamp(2rem,6vw,4rem)}ul{padding:0;list-style:none}li{margin:12px 0}a{display:block;padding:18px;border:1px solid #d9dfd9;color:inherit;text-decoration:none}a:hover{border-color:#b96f4d}</style></head>
          <body><p>AIRDuct / DESIGN DIRECTIONS</p><h1>Choose a template.</h1><ul><li><a href="./architectural/">Architectural ↗</a></li><li><a href="./airflow-lab/">Airflow Lab ↗</a></li><li><a href="./clear-living/">Clear Living ↗</a></li><li><a href="./field-notes/">Field Notes ↗</a></li></ul></body>
          </html>
          EOF
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
