name: Package Airduct for TL

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build main website
        run: |
          npm install
          npm run build
          mkdir -p deliverables/production-builds/main
          cp -R dist/. deliverables/production-builds/main/

      - name: Build four templates
        shell: bash
        run: |
          set -euo pipefail
          for template in architectural airflow-lab clear-living field-notes; do
            npm --prefix "templates/$template" install
            npm --prefix "templates/$template" run build
            mkdir -p "deliverables/production-builds/$template"
            cp -R "templates/$template/dist/." "deliverables/production-builds/$template/"
          done

      - name: Add build instructions
        run: |
          cat > deliverables/production-builds/README.txt <<'EOF'
          AIRDUCT PRODUCTION BUILDS

          Each folder contains a ready-built website, including its index.html and generated assets:
          - main/
          - architectural/
          - airflow-lab/
          - clear-living/
          - field-notes/

          Deploy the CONTENTS of the required folder to a static web host. Do not separate index.html from its assets.
          These are built files; Node.js and node_modules are not required to host them.
          EOF

      - name: Prepare source bundle without node_modules
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deliverables/source
          git archive --format=tar HEAD | tar -xf - -C deliverables/source
          find deliverables/source -type d -name node_modules -prune -exec rm -rf {} +
          cat > deliverables/source/DELIVERY-NOTES.txt <<'EOF'
          AIRDUCT SOURCE CODE

          This source bundle is exported from the repository's tracked files.
          node_modules and the .git directory are not included.
          To install dependencies and build locally, use Node.js 22, then run npm install and npm run build in the project root. Each template in templates/ also has its own package.json and build script.
          EOF

      - name: Assemble one delivery folder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deliverables/Airduct-TL-Delivery
          mv deliverables/production-builds deliverables/Airduct-TL-Delivery/Production-Builds
          mv deliverables/source deliverables/Airduct-TL-Delivery/Source-Code
          cat > deliverables/Airduct-TL-Delivery/README.txt <<'EOF'
          AIRDUCT - TL DELIVERY PACKAGE

          This single package contains both:
          1. Production-Builds - ready-to-deploy output for the main website and four templates.
          2. Source-Code - project source files without node_modules or .git.

          See the README files inside each folder for more details.
          EOF

      - name: Upload one combined delivery package
        uses: actions/upload-artifact@v4
        with:
          name: Airduct-TL-Delivery
          path: deliverables/Airduct-TL-Delivery/
          if-no-files-found: error
          retention-days: 30
